<script>
  // Find first duplicate element from an array
let arr = [10,1,1, 2, 3, 3, 4, 5, 4, 5];

const findFirstDuplicate = (arr) => {
  let ans = [];
  for (let i = 0; i < arr.length; i++) {
    if(ans.includes(arr[i])){
       return arr[i];
    }
    ans.push(arr[i])
  }
};
console.log(findFirstDuplicate(arr));
