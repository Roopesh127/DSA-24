<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <script>
      function LongestWord(str) {
        let arr = [];
        let pc = "";
        for (let i = 0; i < str.length; i++) {
          if (str[i] !== " ") {
            pc += str[i];
          }
          if (str[i] == " ") {
            arr.push(pc);
            pc = "";
          }
        }
        if (pc !== "") {
          arr.push(pc);
        }
        let maxWord = "";

        for (let i = 0; i < arr.length; i++) {
          let currMax = "";
          for (let j = 0; j < arr[i].length; j++) {
            currMax += arr[i][j];
          }
          if (currMax.length > maxWord.length) {
            maxWord = currMax;
          }
          currMax = "";
        }
        console.log(maxWord);
      }
      LongestWord("hello I am Roopesh");
    </script>
  </body>
</html>
