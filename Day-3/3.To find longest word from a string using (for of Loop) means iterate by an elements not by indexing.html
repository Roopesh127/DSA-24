    <script>
      function LongestWord(str) {
        let arr = [];
        let pc = "";
        for (let i = 0; i < str.length; i++) {
          if (str[i] !== " ") {
            pc += str[i];
          }
          if (str[i] == " ") {
            arr.push(pc);
            pc = "";
          }
        }
        if (pc !== "") {
          arr.push(pc);
        }

        let maxCount = 0;
        let maxWord = "";

        for (let i = 0; i < arr.length; i++) {
          let currCount = 0;
          let currMax = "";
          for (let j = 0; j < arr[i].length; j++) {
            currCount++;
            currMax += arr[i][j];
          }
          maxCount = Math.max(maxCount, currCount);
          currCount = 0;

          if (currMax.length > maxWord.length) {
            maxWord = currMax;
          }
          currMax = "";
        }

        console.log(maxCount);
        console.log(maxWord);
      }
      LongestWord("hello I am Roopesh");
