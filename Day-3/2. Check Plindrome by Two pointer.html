  <body>
    <script>
      // To check the string or number is palindrome or not( ex: 121,madam,anna) using diving length
      //  by 2 and then comparing

      function CheckPalindrome(str) {
        let a = "";
        for (let i = str.length - 1; i >= 0; i--) {
          a += str[i];
        }
        return a === str;
      }
      console.log(CheckPalindrome("madam"));
    </script>
  </body>
</html>
